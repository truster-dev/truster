name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build and test
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres@sha256:6567bca8d7bc8c82c5922425a0baee57be8402df92bae5eacad5f01ae9544daa # 17.5-alpine
        env:
          POSTGRES_USER: truster_test
          POSTGRES_PASSWORD: truster_test
          POSTGRES_DB: truster_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U truster_test -d truster_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1
        with:
          version: v3.18.5

      - name: Check formatting and lint
        run: make precommit

      - name: Validate Helm chart
        run: |
          go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          make helm-validate

      - name: Start transaction-mode PgBouncer
        run: |
          cat > "$RUNNER_TEMP/pgbouncer.ini" <<'EOF'
          [databases]
          truster_test = host=host.docker.internal port=5432 dbname=truster_test

          [pgbouncer]
          listen_addr = 0.0.0.0
          listen_port = 6432
          pool_mode = transaction
          max_prepared_statements = 0
          auth_type = scram-sha-256
          auth_file = /etc/pgbouncer/userlist.txt
          auth_user = truster_test
          EOF
          printf '%s\n' '"truster_test" "truster_test"' > "$RUNNER_TEMP/pgbouncer-userlist.txt"
          docker run -d --name truster-ci-pgbouncer \
            --add-host=host.docker.internal:host-gateway \
            -p 6432:6432 \
            -v "$RUNNER_TEMP/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro" \
            -v "$RUNNER_TEMP/pgbouncer-userlist.txt:/etc/pgbouncer/userlist.txt:ro" \
            ghcr.io/cloudnative-pg/pgbouncer@sha256:fd6ce6214390a2ff90bde014c6e5bfa64c99fcca6b0bdd53a63be4865ee5b5ac
          for i in $(seq 1 30); do
            docker exec truster-ci-pgbouncer pg_isready -h 127.0.0.1 -p 6432 -U truster_test -d truster_test && exit 0
            sleep 1
          done
          docker logs truster-ci-pgbouncer
          exit 1

      - name: Test
        run: make test
        env:
          TRUSTER_STATE_TEST_DIRECT_DB_URL: postgresql://truster_test:truster_test@localhost:5432/truster_test?sslmode=disable
          TRUSTER_STATE_TEST_PGBOUNCER_DB_URL: postgresql://truster_test:truster_test@localhost:6432/truster_test?sslmode=disable
          TRUSTER_POLICY_TEST_DIRECT_DB_URL: postgresql://truster_test:truster_test@localhost:5432/truster_test?sslmode=disable
          TRUSTER_POLICY_TEST_PGBOUNCER_DB_URL: postgresql://truster_test:truster_test@localhost:6432/truster_test?sslmode=disable

      - name: Upload coverage
        uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5.5.5
        with:
          files: ./coverage.out

      - name: Build
        run: make build

  tf-modules:
    name: Validate TF modules
    uses: ./.github/workflows/release-tf.yml
    with:
      publish: false
      preflight: ${{ github.event_name == 'push' }}
    secrets: inherit

  e2e:
    name: End-to-end test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      KUBECTL_VERSION: v1.33.2
      KUBELOGIN_VERSION: v1.36.2
      OAUTH2C_VERSION: 1.20.0
      OAUTH2C_LINUX_AMD64_SHA256: 9228fe4691206d1bf654c59df63038747e791cac8d03fda62ba4f0d87221a93d # v1.20.0
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod

      - name: Install E2E tools
        run: |
          tool_dir="$RUNNER_TEMP/e2e-bin"
          mkdir -p "$tool_dir"
          curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl" -o "$tool_dir/kubectl"
          checksum="$(curl -fsSL "https://dl.k8s.io/release/$KUBECTL_VERSION/bin/linux/amd64/kubectl.sha256")"
          echo "$checksum  $tool_dir/kubectl" | sha256sum --check
          chmod +x "$tool_dir/kubectl"
          GOBIN="$tool_dir" go install "github.com/int128/kubelogin@$KUBELOGIN_VERSION"
          ln -s kubelogin "$tool_dir/kubectl-oidc_login"
          oauth2c_archive="$RUNNER_TEMP/oauth2c.tar.gz"
          curl -fsSL "https://github.com/SecureAuthCorp/oauth2c/releases/download/v$OAUTH2C_VERSION/oauth2c_${OAUTH2C_VERSION}_Linux_x86_64.tar.gz" -o "$oauth2c_archive"
          echo "$OAUTH2C_LINUX_AMD64_SHA256  $oauth2c_archive" | sha256sum --check
          tar -xzf "$oauth2c_archive" -C "$tool_dir" oauth2c
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Test
        run: make e2e
        env:
          CONTAINER_CMD: docker
          E2E_HEADLESS: "true"
